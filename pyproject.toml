[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "layover"
version = "0.1.0"
description = "Agent-aware LLM inference engine with per-tool-call KV cache placement"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.15",
    "transformers>=4.51",
    "safetensors",
    "huggingface_hub",
    "numpy",
    "matplotlib",
    "fastapi",
    "uvicorn",
    "httpx",
]

[project.optional-dependencies]
dev = ["pytest", "hypothesis", "openai"]
gpu = ["triton==3.9.0", "nvidia-ml-py"]

[tool.setuptools.packages.find]
include = ["layover*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "gpu: needs a CUDA GPU; enable with --gpu",
    "weights: downloads Hugging Face weights or a tokenizer; skipped when LAYOVER_OFFLINE=1",
]

[tool.ruff]
target-version = "py311"
extend-exclude = ["traces", "results"]

[tool.ruff.lint]
# `l` is the load label in short loops over (workload, system, load, run) keys.
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
# Fixtures imported from a shared module and then taken as test parameters.
"tests/*" = ["F811"]
